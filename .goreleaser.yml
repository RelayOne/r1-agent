version: 2

project_name: r1

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./... -count=1 -timeout=120s
    # sqlite_fts5-tagged lane (audit A068): the FTS5 dormancy guard in
    # internal/research/fts5_active_test.go only compiles under the tag,
    # which the untagged run above never sets.
    - go test -tags sqlite_fts5 -count=1 -timeout=120s ./internal/research/ ./internal/wisdom/

builds:
  - id: r1
    main: ./cmd/r1
    binary: r1
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
      # sqlite_fts5 keeps research/wisdom FTS5 active in release
      # binaries (audit A006) — without the tag Search silently
      # degrades to the LIKE fallback despite working SQLite.
      - -tags=sqlite_fts5
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
  - id: r1-darwin
    # Darwin legs split out of the CGO 'r1' build (audit A044): linux
    # needs CGO for mattn/go-sqlite3, but cross-compiling darwin with
    # CGO requires osxcross (CC=o64-clang) which the release image
    # (cloudbuild-release.yaml, golang:1.25) does not ship — the darwin
    # legs failed with 'exec: o64-clang: not found' and aborted every
    # tag release. CGO_ENABLED=0 compiles go-sqlite3's !cgo stub:
    # SQLite-backed features error at runtime on darwin, matching the
    # CGO_ENABLED=0 darwin binaries the GCS pipeline already ships.
    main: ./cmd/r1
    binary: r1
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - id: r1-acp
    # Agent Client Protocol adapter (S-U-002). Pure-Go JSON-RPC
    # stdio transport; no CGO dependency unlike the main r1
    # binary, so cross-compiles without the gcc overrides.
    main: ./cmd/r1-acp
    binary: r1-acp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # D-014: RelayOne/r1-agent is the canonical repo (new repo, not rename).
  # Goreleaser publishes releases to RelayOne/r1-agent. The GITHUB_TOKEN
  # on CI is scoped to the repo the workflow runs in, so this must match
  # the repo where the workflow + tag live.
  github:
    owner: RelayOne
    name: r1-agent
  draft: false
  prerelease: auto

brews:
  - name: r1
    repository:
      owner: RelayOne
      name: homebrew-r1
      branch: main
    directory: Formula
    homepage: https://github.com/RelayOne/r1-agent
    description: "R1 — agentic coding orchestrator"
    license: "Apache-2.0"
    install: |
      bin.install "r1"
      bin.install "r1-acp" if File.exist?("r1-acp")
    test: |
      system "#{bin}/r1", "--version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(brew): r1 {{ .Tag }}"
