# services/cloudbuild-bench-truthful-completion-pr.yaml
#
# Intended PR TruthfulCompletion regression check. Runs the 5 seed
# missions against the checked-in agent matrix. The operator setup path
# is `scripts/setup-bench-truthful-completion-cron.sh`, which provisions
# the `bench-truthful-completion-pr` trigger in resolute-parity-484218-g1/us-central1.
# This build does NOT yet post the PR delta comment promised in the full
# spec; it currently performs the mini-run only.
#
# Spec: specs/truthful-completion-benchmark.md §T8.2 (item 56).

substitutions:
  _CORPUS_DIR: internal/bench/golden/truthful-completion
  _AGENTS: r1,r1-antitrunc,tether+aider,tether+cline
  _TIMEOUT: 5m

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build
    name: 'golang:1.26'
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd /workspace
        go build -trimpath -o /workspace/r1-bench-bin ./cmd/r1-bench

  - id: test
    name: 'golang:1.26'
    waitFor: ['build']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd /workspace
        go test ./internal/bench/... ./cmd/r1-bench/...

  - id: seed-runs
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['test']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p /workspace/seed-out
        # Use --no-judge for PR runs (no API budget for judge calls
        # on every PR). The full judge runs on the monthly cadence.
        SEEDS="seed-hello-easy seed-refactor-medium seed-feature-medium seed-migration-hard seed-perfect-agent-fixture"
        IFS=',' read -ra AGENTS_ARR <<< "${_AGENTS}"
        for MISSION in $$SEEDS; do
          for AGENT in "$${AGENTS_ARR[@]}"; do
            OUT="/workspace/seed-out/$${AGENT//\+/_}--$${MISSION}.json"
            /workspace/r1-bench-bin \
              --mission "$$MISSION" \
              --agent "$$AGENT" \
              --corpus "${_CORPUS_DIR}" \
              --no-judge \
              --timeout "${_TIMEOUT}" \
              --output "$$OUT" \
              || echo "WARN: $${AGENT}/$${MISSION} failed"
          done
        done
        ls -la /workspace/seed-out/

timeout: 1800s  # 30 minutes max
