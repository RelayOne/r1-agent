# Web (chat UI) CI gate.
#
# Spec web-chat-ui §item 50: "Root CI workflow runs `cd web && npm ci
# && npm run build && npm run test`". Closes audit/scan-governance-gaps.md
# web-chat-ui item 50 ("Top-level web CI workflow not present").
#
# Two jobs: build-test (typecheck + vite build + vitest run) and
# lint (npm run lint inside web/). The actionables-contract that a
# story-level a11y validator was previously meant to enforce is
# already covered by tools/lint-view-without-api/.
#
# Triggers on PRs that touch web/ or the workflow file itself. Skips
# unrelated changes to keep CI fast.

name: web

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - '.github/workflows/web.yml'

# Cancel previous runs on the same PR/branch when a new push lands.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
      - name: npm test
        run: npm test

  lint:
    name: lint (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint

