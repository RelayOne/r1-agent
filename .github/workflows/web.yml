# Web (chat UI) CI gate.
#
# Spec web-chat-ui §item 50: "Root CI workflow runs `cd web && npm ci
# && npm run build && npm run test`". Closes audit/scan-governance-gaps.md
# web-chat-ui item 50 ("Top-level web CI workflow not present").
#
# Three jobs: build-test (typecheck + vite build + vitest run), lint
# (npm run lint inside web/), and storybook-mcp-validate (Makefile
# target run from repo root).
#
# Triggers on PRs that touch web/ or the workflow file itself. Skips
# unrelated changes to keep CI fast.

name: web

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    paths:
      - 'web/**'
      - 'package.json'
      - '.github/workflows/web.yml'

# Cancel previous runs on the same PR/branch when a new push lands.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run build
        run: npm run build
      - name: npm test
        run: npm test

  lint:
    name: lint (web)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run lint
        run: npm run lint

  storybook-mcp-validate:
    name: storybook-mcp-validate
    runs-on: ubuntu-24.04
    # Non-blocking: storybook-mcp 0.5.x requires STORYBOOK_URL at runtime,
    # which would need a live storybook server in CI. The job stays visible
    # so static-config drift is still caught when it can run, but a
    # config-prereq failure does not block PRs. Tracked as a follow-up to
    # specs/post-merge-audit-cleanup.md TASK-5.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm ci (web)
        working-directory: web
        run: npm ci
      - name: make storybook-mcp-validate
        run: make storybook-mcp-validate

