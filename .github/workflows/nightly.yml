name: nightly

# Nightly cron lane. PR CI continues to run `go test ./...`
# (which skips the integration-tagged 1000-concurrent benchmark).
#
# Two jobs (audit A042 — the original single job pinned the nightly
# cron to a `large-linux` self-hosted runner that was never registered,
# so every scheduled run queued for 24h and was cancelled by GitHub's
# queue cap; timeout-minutes only bounds execution, not queue time):
#
#   - oneshot-concurrent: scheduled cron, ubuntu-latest, reduced-size
#     benchmark via the Makefile-documented commodity-host overrides
#     (R1_BENCH_CONCURRENCY=100, R1_BENCH_WALL_BUDGET_S=10) so the
#     nightly lane produces real regression signal on a hosted runner.
#   - oneshot-concurrent-full: workflow_dispatch only, pinned to
#     [self-hosted, large-linux] for the full 1000-concurrent run.
#     Registering that runner is an operator task; until then this
#     job is only reachable manually and never blocks the cron lane.
#
# Spec: specs/oneshot-production-hardening.md §T5.4.
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC nightly
  workflow_dispatch: {}

jobs:
  # Race-detection lane over the core concurrency packages (HARD1).
  # Runs `make test-race` — the focused RACE_CORE_PKGS lane (bus, cortex,
  # scheduler, engine, session, hub, boulder, worktree, memory) — nightly
  # and on demand. The full-repo -race sweep already runs on every push
  # to main via the Cloud Build `race` step (cloudbuild.yaml); this job
  # exists so race regressions in the harness's coordination core are
  # caught even during stretches with no push to main. All nine package
  # trees were verified race-clean when this lane landed (2026-07-02).
  race-core:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: core-concurrency race lane
        # shell: bash (vs the implicit default) turns on -o pipefail so
        # a race failure is not masked by tee's exit 0.
        shell: bash
        run: make test-race 2>&1 | tee race-core-summary.txt
      - name: upload summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-core-summary
          path: race-core-summary.txt

  oneshot-concurrent:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ulimits and host info
        run: |
          ulimit -n 65535 || true
          ulimit -u 4096 || true
          echo "nofile=$(ulimit -n)"
          echo "nproc=$(ulimit -u)"
          echo "host_nproc=$(nproc)"
          uname -a
      - name: reduced-size concurrent benchmark (commodity runner)
        env:
          R1_BENCH_CONCURRENCY: "100"
          R1_BENCH_WALL_BUDGET_S: "10"
        run: make test-oneshot-concurrent | tee oneshot-concurrent-summary.txt
      - name: upload summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneshot-concurrent-summary
          path: oneshot-concurrent-summary.txt

  # Full-size benchmark. Requires an operator-registered self-hosted
  # runner with the `large-linux` label (65k nofile, >=8 cores).
  # Deliberately NOT on the cron: with no matching runner registered
  # a scheduled job queues for 24h and is cancelled every night.
  oneshot-concurrent-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, large-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ulimits and host info
        run: |
          ulimit -n 65535 || true
          ulimit -u 4096 || true
          echo "nofile=$(ulimit -n)"
          echo "nproc=$(ulimit -u)"
          echo "host_nproc=$(nproc)"
          uname -a
      - name: 1000-concurrent benchmark
        run: make test-oneshot-concurrent | tee oneshot-concurrent-summary.txt
      - name: upload summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneshot-concurrent-full-summary
          path: oneshot-concurrent-summary.txt
