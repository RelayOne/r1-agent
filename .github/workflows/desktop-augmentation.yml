# R1 Desktop — Cortex Augmentation CI gate.
#
# Spec desktop-cortex-augmentation §11.5 + checklist item 38. This
# workflow is dedicated to the spec-7 deliverables (lane sidebar,
# workdir picker, daemon discovery, pop-out windows, native menu).
# The pre-existing `desktop.yml` workflow (R1D-* phases) is
# untouched per spec §12 R6 — adding a separate workflow keeps
# install scoping deterministic.
#
# Three parallel jobs per OS:
#   * cargo (rust): build + lib unit + bin unit + tests/* integration
#   * components (vitest): @r1/web-components Lane* tests
#   * desktop-vitest: desktop/ existing R1D-* tests
#
# E2E job runs after the three above succeed, on each of macOS-latest
# / ubuntu-24.04 / windows-latest. Spec §11.5 says the e2e suite
# blocks merge on red.
#
# TRUTH NOTE (CI-2 desktop-e2e-truth, 2026-06-12): the app currently
# ships NO test-mode driver surface, so every spec under
# desktop/tests/e2e/ is skipped-with-reason (see
# audit/desktop-e2e-truth-2026-06-12.md). What this e2e job REALLY
# verifies today: (a) the Tauri app compiles in the release profile on
# all three OSes — the only CI leg that builds release — and (b) the
# Playwright harness compiles and collects with a deterministic
# 12-skipped/0-failed split. The tauri-driver install/start glue was
# removed: the old harness never spoke WebDriver to it (it POSTed
# invented verbs that tauri-driver does not serve), and tauri-driver
# does not support macOS at all. Restore a real driver setup when the
# test-mode surface lands (PROGRAM-DAG-2026-05-15 Layer B).

name: desktop-augmentation

on:
  push:
    branches:
      - main
      - 'build/desktop-*'
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/web-components/**'
      - 'package.json'
      - '.github/workflows/desktop-augmentation.yml'

# Cancel previous runs on the same branch when a new push lands.
concurrency:
  group: desktop-augmentation-${{ github.ref }}
  cancel-in-progress: true

env:
  # -D warnings is back on. The two unwired modules (discovery,
  # transport — see desktop/src-tauri/src/{discovery,transport}.rs)
  # carry a #![allow(dead_code)] until their wiring lands in a
  # future spec 7 revision. Remove those module attributes once the
  # multi-session daemon path goes live.
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install Linux deps for tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Materialise empty externalBin stubs
        shell: bash
        run: bash desktop/scripts/copy-r1-binaries.sh
      - name: cargo build
        working-directory: desktop
        run: cargo build --locked
      - name: cargo test
        working-directory: desktop
        run: cargo test --locked

  components:
    name: components (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install (workspace root)
        run: npm install --workspaces --include-workspace-root
      - name: npm test (web-components)
        run: npm test --workspace=@r1/web-components

  desktop-vitest:
    name: desktop (vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install (workspace root)
        run: npm install --workspaces --include-workspace-root
      - name: npm test (desktop)
        run: npm test --workspace=desktop

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [cargo, components, desktop-vitest]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install Linux deps for tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Materialise empty externalBin stubs
        shell: bash
        run: bash desktop/scripts/copy-r1-binaries.sh
      - name: npm install (workspace root)
        run: npm install --workspaces --include-workspace-root
      # No tauri-driver install/start and no Playwright-browser download:
      # the specs use a custom harness (no browser fixtures), all specs
      # are currently skipped-with-reason, and the previous driver glue
      # was never actually exercised (see TRUTH NOTE in the header).
      - name: cargo build (release)
        working-directory: desktop
        run: cargo build --release
      - name: Run Playwright e2e (collect + skip split)
        working-directory: desktop
        run: npx playwright test
        shell: bash
