<body hx-ext="sse" data-session-id="sess-fixture">
  <header class="topbar" role="banner">
  <div class="topbar__brand"><a href="/">r1</a></div>
  <nav class="topbar__nav" aria-label="Session views">
    <a href="/session/sess-fixture" aria-current="page" data-testid="tab-waterfall">Waterfall</a>
    <a href="/session/sess-fixture/graph" data-testid="tab-graph">3D Graph</a>
    <a href="/session/sess-fixture/stream" data-testid="tab-stream">Stream</a>
    <a href="/memories?session=sess-fixture" data-testid="tab-memories">Memories</a>
  </nav>
</header>
  <main id="main">
    <section class="pane pane--primary waterfall"
         data-testid="waterfall"
         hx-ext="sse"
         sse-connect="/api/session/sess-fixture/events/stream?last_event_id=0"
         sse-swap="waterfall-node">
  <table class="waterfall__table">
    <thead>
      <tr>
        <th></th>
        <th></th>
        <th scope="col">Event</th>
        <th scope="col">Duration</th>
        <th scope="col">Cost</th>
        <th></th>
      </tr>
    </thead>
    <tbody data-testid="waterfall-rows">
      <tr class="row"
    data-node-id="n-1"
    data-node-type="agent_io"
    data-cursor="1735732800"
    style="content-visibility: auto;">
  <td class="indent" style="--depth: 0;"></td>
  <td class="icon" aria-hidden="true">📦</td>
  <td class="title">first</td>
  <td class="duration">10ms</td>
  <td class="cost">$0.001</td>
  <td class="redacted-slot"></td>
</tr><tr class="row row--redacted"
    data-node-id="n-2"
    data-node-type="agent_io"
    data-cursor="1735732815" data-state="redacted"
    style="content-visibility: auto;">
  <td class="indent" style="--depth: 0;"></td>
  <td class="icon" aria-hidden="true"><svg class="icon-lock" viewBox="0 0 12 12" aria-hidden="true" focusable="false">

</svg></td>
  <td class="title">second</td>
  <td class="duration">15ms</td>
  <td class="cost">$0.002</td>
  <td class="redacted-slot"><span aria-hidden="true" data-redacted="true">[content redacted]</span></td>
</tr>
      <tr><td colspan="6">
        <div data-testid="page-sentinel"
             hx-trigger="revealed"
             hx-get="/session/sess-fixture/waterfall?after=0"
             hx-swap="outerHTML"
             aria-hidden="true"></div>
      </td></tr>
    </tbody>
  </table>
</section>
<aside id="side-panel" class="pane pane--side" role="complementary"
       aria-label="Selected node details">
  <div class="muted" data-testid="side-panel-empty" style="padding:16px;">
  <p>Hover or click a row to inspect.</p>
</div>
</aside>
  </main>
  <footer id="scrubber-bar"
        style="position:fixed;left:0;right:0;bottom:0;height:56px;
               border-top:1px solid var(--color-border);
               background:var(--color-bg);padding:8px 16px;
               display:flex;align-items:center;gap:12px;z-index:5;">
  <div class="chips" role="group" aria-label="Filter">
  
  <button type="button"
          class="chip"
          data-testid="chip-types"
          data-state="inactive"
          data-hx-get="/session/sess-fixture/waterfall?types=error.*"
          data-hx-target="[data-testid='waterfall-rows']"
          data-hx-trigger="click"
          name="types"
          value="error.*">
    errors
  </button>
  
</div>
  <input type="search" name="q" placeholder="Search nodes..."
         data-testid="search-nodes"
         hx-get="/session/sess-fixture/waterfall"
         hx-trigger="input changed delay:200ms"
         hx-target="[data-testid='waterfall-rows']"
         hx-include="[name='types']" />
  <label for="timeline-scrubber" class="sr-only">Timeline scrubber</label>
  <input type="range" id="timeline-scrubber" data-island="scrubber"
         data-testid="timeline-scrubber"
         min="1735732800" max="1735819200"
         style="flex:1;" />
</footer>
</body>
</html>
